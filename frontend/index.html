<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aandelenradar — Trending aandelen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Topbalk ── */
    .topbalk {
      background: #162447;
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      border-bottom: 3px solid #e84545;
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo span { color: #e84545; }

    .topbalk-meta {
      font-size: 0.78rem;
      color: #94a3b8;
      text-align: right;
    }

    /* ── Subbalk ── */
    .subbalk {
      background: #1e3163;
      padding: 0 24px;
      display: flex;
      gap: 24px;
      border-bottom: 1px solid #273d72;
    }

    .subbalk a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 10px 0;
      border-bottom: 2px solid transparent;
      display: inline-block;
    }

    .subbalk a.actief {
      color: #fff;
      border-bottom-color: #e84545;
    }

    /* ── Wrapper ── */
    .wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    /* ── Sectietitel ── */
    .sectietitel {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #162447;
    }

    .sectietitel h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #162447;
    }

    .sectietitel .subtitel {
      font-size: 0.78rem;
      color: #64748b;
    }

    #status {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 3px;
      background: #e2e8f0;
      color: #475569;
    }

    #status.laden  { background: #fef3c7; color: #92400e; }
    #status.fout   { background: #fee2e2; color: #991b1b; }
    #status.ok     { background: #dcfce7; color: #166534; }

    /* ── Grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }

    /* ── Kaart ── */
    .kaart {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      transition: box-shadow .15s, transform .15s;
    }

    .kaart:hover {
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
      transform: translateY(-1px);
    }

    .kaart-kleur {
      height: 4px;
    }

    .kleur-kopen     { background: #16a34a; }
    .kleur-watchlist { background: #d97706; }
    .kleur-vermijden { background: #dc2626; }

    .kaart-body { padding: 16px 18px; }

    /* ── Bovenste rij ── */
    .kaart-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .ticker-naam .ticker {
      font-size: 1.1rem;
      font-weight: 700;
      color: #162447;
      line-height: 1;
    }

    .ticker-naam .bedrijf {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 3px;
    }

    .score-blok {
      text-align: right;
    }

    .score-blok .getal {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
      color: #162447;
    }

    .score-blok .label {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* ── Prijs rij ── */
    .prijs-rij {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 12px;
    }

    .prijs {
      font-size: 1.35rem;
      font-weight: 600;
      color: #0f172a;
    }

    .verandering {
      font-size: 0.85rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 3px;
    }

    .pos { background: #dcfce7; color: #15803d; }
    .neg { background: #fee2e2; color: #b91c1c; }
    .neu { background: #f1f5f9; color: #475569; }

    /* ── Labels rij ── */
    .labels-rij {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .label-pill {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .pill-bullish   { background: #dcfce7; color: #15803d; }
    .pill-bearish   { background: #fee2e2; color: #b91c1c; }
    .pill-neutraal  { background: #f1f5f9; color: #475569; }
    .pill-kopen     { background: #162447; color: #fff; }
    .pill-watchlist { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .pill-vermijden { background: #fee2e2; color: #991b1b; }
    .pill-risico    { background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0; }

    /* ── Volume balk ── */
    .volume-rij {
      margin-bottom: 12px;
    }

    .volume-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .balk-bg {
      background: #f1f5f9;
      border-radius: 2px;
      height: 5px;
    }

    .balk-vulling {
      height: 100%;
      border-radius: 2px;
      background: #162447;
    }

    /* ── Samenvatting ── */
    .samenvatting {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.55;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }

    /* ── Skeleton ── */
    .skeleton {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 18px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .sk-lijn {
      background: #f1f5f9;
      border-radius: 3px;
      height: 13px;
      margin-bottom: 10px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .55; }
    }

    /* ── Fout ── */
    .fout-blok {
      display: none;
      background: #fff5f5;
      border: 1px solid #fecaca;
      border-left: 4px solid #dc2626;
      border-radius: 4px;
      padding: 14px 16px;
      font-size: 0.82rem;
      color: #7f1d1d;
      margin-bottom: 20px;
    }

    /* ── Footer ── */
    footer {
      background: #162447;
      color: #64748b;
      text-align: center;
      font-size: 0.73rem;
      padding: 18px;
      margin-top: 40px;
    }

    footer strong { color: #94a3b8; }
  </style>
</head>
<body>

<div class="topbalk">
  <div class="logo">Aandelen<span>Radar</span></div>
  <div class="topbalk-meta" id="tijdstip">—</div>
</div>

<div class="subbalk">
  <a href="#" class="actief">Trending</a>
  <a href="#">Top stijgers</a>
  <a href="#">Top dalers</a>
  <a href="#">Watchlist</a>
</div>

<div class="wrapper">
  <div class="sectietitel">
    <div>
      <h2>Trending aandelen vandaag</h2>
      <div class="subtitel">Top 10 op basis van momentum en volumescore — elke 5 minuten bijgewerkt</div>
    </div>
    <div id="status" class="laden">Laden…</div>
  </div>

  <div class="fout-blok" id="fout-blok"></div>
  <div id="grid"></div>
</div>

<footer>
  <strong>AandelenRadar</strong> &nbsp;·&nbsp; Data via Yahoo Finance &nbsp;·&nbsp; Geen beleggingsadvies
</footer>

<script>
  const API = "/api/trending";
  const INTERVAL = 5 * 60 * 1000;

  function updateTijd() {
    const nu = new Date();
    document.getElementById("tijdstip").textContent =
      nu.toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" }) +
      " · " + nu.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
  }

  updateTijd();
  setInterval(updateTijd, 30000);

  function kleurActie(actie) {
    if (actie === "kopen") return "kleur-kopen";
    if (actie === "vermijden") return "kleur-vermijden";
    return "kleur-watchlist";
  }

  function vcls(pct) {
    return pct > 0 ? "pos" : pct < 0 ? "neg" : "neu";
  }

  function balkBreedte(ratio) {
    return Math.min(100, (ratio / 3) * 100).toFixed(0);
  }

  function skeletons(n) {
    return Array.from({ length: n }, () => `
      <div class="skeleton">
        <div class="sk-lijn" style="width:35%"></div>
        <div class="sk-lijn" style="width:55%"></div>
        <div class="sk-lijn" style="width:80%"></div>
        <div class="sk-lijn" style="width:65%"></div>
      </div>`).join("");
  }

  function renderKaart(a) {
    const pct = a.verandering_pct ?? 0;
    const teken = pct > 0 ? "+" : "";
    const score = a.score ?? Math.round(a.momentum_score ?? 0);
    const ratio = a.volume_ratio ?? 1;

    return `
      <div class="kaart">
        <div class="kaart-kleur ${kleurActie(a.actie)}"></div>
        <div class="kaart-body">
          <div class="kaart-top">
            <div class="ticker-naam">
              <div class="ticker">${a.ticker}</div>
              <div class="bedrijf">${a.bedrijf ?? ""}</div>
            </div>
            <div class="score-blok">
              <div class="getal">${score}</div>
              <div class="label">momentum</div>
            </div>
          </div>

          <div class="prijs-rij">
            <span class="prijs">$${(a.prijs ?? 0).toLocaleString("nl-NL", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
            <span class="verandering ${vcls(pct)}">${teken}${pct.toFixed(2)}%</span>
          </div>

          <div class="labels-rij">
            ${a.sentiment ? `<span class="label-pill pill-${a.sentiment}">${a.sentiment}</span>` : ""}
            ${a.actie     ? `<span class="label-pill pill-${a.actie}">${a.actie}</span>` : ""}
            ${a.risico    ? `<span class="label-pill pill-risico">risico: ${a.risico}</span>` : ""}
          </div>

          <div class="volume-rij">
            <div class="volume-header">
              <span>Volume</span>
              <span>${ratio.toFixed(2)}× gemiddeld</span>
            </div>
            <div class="balk-bg">
              <div class="balk-vulling" style="width:${balkBreedte(ratio)}%"></div>
            </div>
          </div>

          ${a.samenvatting ? `<div class="samenvatting">${a.samenvatting}</div>` : ""}
        </div>
      </div>`;
  }

  async function laadData() {
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const foutBlok = document.getElementById("fout-blok");

    status.textContent = "Bijwerken…";
    status.className = "laden";
    foutBlok.style.display = "none";

    if (!grid.children.length) grid.innerHTML = skeletons(10);

    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      grid.innerHTML = data.aandelen.map(renderKaart).join("");

      const tijd = new Date().toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
      status.textContent = `Bijgewerkt ${tijd}`;
      status.className = "ok";
    } catch (err) {
      status.textContent = "Fout";
      status.className = "fout";
      foutBlok.style.display = "block";
      foutBlok.textContent = `Gegevens konden niet worden opgehaald (${err.message}). Probeer de pagina te vernieuwen.`;
    }
  }

  laadData();
  setInterval(laadData, INTERVAL);
</script>
</body>
</html>
